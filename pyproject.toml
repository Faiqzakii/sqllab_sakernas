[project]
name = "superset-sqllab-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116.1",
  "pandas>=2.3.2",
  "camoufox>=0.4.11",
  "requests>=2.32.5",
  "sqlmodel>=0.0.24",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
norecursedirs = [
  "sqllab_sakernas",
]
